# Example Kitty session file for Claude Code multi-account workflow
#
# Usage:
#   kitty --session /path/to/this/file
#
# Convention: prefix tab titles with W: (work) or P: (personal)
# to visually distinguish account contexts at a glance.
#
# Customize the paths and tab titles to match your projects.
# See: https://sw.kovidgoyal.net/kitty/overview/#sessions

# --- Work account (uses default `claude` command) ---

new_tab W:project-alpha
cd ~/projects/project-alpha
launch claude

new_tab W:project-beta
cd ~/projects/project-beta
launch claude

new_tab W:scratch
cd ~/tmp
launch claude


# --- Personal account (uses CLAUDE_CONFIG_DIR override) ---

new_tab P:side-project
cd ~/personal/side-project
launch env CLAUDE_CONFIG_DIR=~/.claude-personal claude

new_tab P:dotfiles
cd ~/dotfiles
launch env CLAUDE_CONFIG_DIR=~/.claude-personal claude
