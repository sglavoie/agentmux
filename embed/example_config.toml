# Agent Mux starter configuration file.
#
# Default location: ~/.config/agent-mux/config.toml
# Useful commands:
#   amx config init      Write this starter config to the default config path.
#   amx config path      Print the resolved config file path.
#   amx config edit      Open the config in $EDITOR.
#   amx config show      Print the config file as-is.
#   amx config validate  Validate config values, references, and project directories.
#
# This starter config is intentionally safe for first launch: it does not add
# any profiles or projects until you uncomment and customize the examples
# below.
# Restart the dashboard after editing this file; config changes are loaded on
# startup.
#
# Paths in this file (home_dir, directory) support `~` for $HOME.

[defaults]

# Sort order for sessions in the TUI list.
# "alpha" sorts by title alphabetically; "account" groups sessions by profile.
sort = "alpha"

# How often the TUI polls for session state changes, in seconds.
refresh_interval = 2

# Minimum time between icon state transitions, in seconds.
# Prevents rapid flickering when a harness emits bursts of hook events.
guard_duration = 1

# Seconds of inactivity after which a session is considered idle.
idle_threshold = 300

# Flags passed to every harness session, regardless of profile.
# Use this only for harness-neutral flags (e.g. a wrapper script flag).
# Put harness-specific flags (e.g. --dangerously-skip-permissions) on the
# relevant profile instead, so they do not bleed into other harnesses.
# Args resolve with this precedence (highest first):
#   project args → profile args → defaults.args
args = []

# Whether the three actions that end or replace a live harness process — close,
# restart, and restart under another profile — stop for a y/n confirmation
# naming what they destroy. When false (default) they run immediately and report
# themselves on the feedback row or a toast. The answer is read once and applies
# wherever the action is reached: the actions menu, the command palette, and the
# F2 overview all honor it, because a restart reached by name and a restart
# reached by mnemonic are the same act. Launching another session is not covered:
# it asks for a profile like a replacement does, but it ends nothing.
confirm_destructive = false

# Per-directory Git probe. The daemon asks each live session's directory for
# its branch name and whether it has uncommitted changes to tracked files, so
# the dashboard can tell apart rows that share a repository and differ only by
# worktree. It is advisory decoration: two short git commands per directory,
# cached for a few seconds, run off the render path, and every failure — a
# directory that is not a repository, a missing git, a timeout, a detached
# HEAD — is silently reported as no branch rather than as an error.
#
# Set to false to stop running git entirely. That is worth doing if your
# sessions live on a network filesystem or a slow mount, where the two commands
# cost round trips instead of microseconds. Read once when the daemon starts:
# run `amx daemon restart` after changing it.
# git_probe = true
# On a slow mount you can keep the column and tune the probe instead, in
# seconds: how long an answer is reused (default 10) and how long one probe may
# take before it is abandoned (default 2). 0 keeps the default.
# git_probe_ttl = 10
# git_probe_timeout = 2

# Editor command used by the actions menu's "Open editor" entry (`a`, then
# `O`) and by the worktrees browser's. When unset, falls back to $VISUAL, then
# $EDITOR, then "vi". Multi-token values like "code --wait" are split on
# whitespace.
# editor = "nvim"

# Filesystem root scanned by the Plans browser (`:`, then "Search Plans").
# Each top-level directory under this root is treated as one plan.
# plans_directory = "~/.local/share/agent-plans"
# Plans in that directory and harness transcript files remain authoritative.
# Agent Mux keeps only disposable filesystem caches at:
#   ~/.local/share/agent-mux/transcripts.json + transcripts.search/
#   ~/.local/share/agent-mux/plans.json       + plans.search/
# Corrupt cache metadata is quarantined and rebuilt; no SQLite database is
# created. Standalone handoffs, Git worktrees, and launch_overrides.json are
# separate user assets and are never removed by cache maintenance.

# Optional agent-session-loop (ASL) integration. The daemon starts
# `<command> bridge serve --stdio --protocol 2` after its own socket is
# published, so a missing or slow ASL never delays Agent Mux.
#
# Omitting `enabled` probes for ASL and stays quiet when it is absent. Setting
# it to true additionally reports an unavailable integration through
# `amx doctor`, without making the daemon itself unready. Setting it to false
# never starts a subprocess at all.
#
# `command` must be a plain executable name or path: the daemon supplies the
# arguments and never runs it through a shell. A value containing a space is
# accepted only when it is an existing absolute path to an executable file.
#
# The whole section is optional. Omitting it entirely is the auto mode above,
# so upgrading needs no config change: without ASL installed, Agent Mux behaves
# exactly as it did before. Install or upgrade ASL first, then Agent Mux — an
# older bridge is reported as unavailable rather than driven at a protocol it
# does not speak.
#
# The integration powers the `A` runs view: answering questions, resuming,
# stopping, and aborting runs that are already in flight. It never starts or
# tails a loop, and it never records question or reply text. See docs/usage.md.
[defaults.asl]
# enabled = true
# command = "asl"
#
# state_root is where ASL keeps its per-plan state, which is where Agent Mux
# reads run presence from. Leave it unset unless ASL has been moved off its
# default location: the default is derived the same way ASL derives it, and
# pairing records the canonical value here. It must be absolute or start with
# "~" — a relative path would resolve against the daemon's working directory
# rather than yours, and Agent Mux would simply report no runs.
# state_root = "~/.local/state/agent-session-loop"

# Where the paired release gate stores its signed evidence records. This is
# release-operator tooling: nothing in the daemon, the dashboard, or any session
# path reads it, and an installation that never cuts a release can ignore it.
#
# Leave it unset to use ~/.local/share/agent-mux/release-evidence, beside the
# caches and handoffs. Each run writes <pair-id>.json plus a detached
# <pair-id>.json.sig; see docs/paired-releases.md for how to verify one.
[defaults.release]
# evidence_dir = "~/.local/share/agent-mux/release-evidence"

# Live pane geometry, shared by the dashboard's session inspector (`i`) and the
# launcher's preview (`p`, inside the launcher). Ratio is the fraction of the
# terminal the pane asks for, refresh is in milliseconds while it is open, and
# the min_* values turn the pane off automatically on terminals too small to
# keep both halves usable.
#
# Direction chooses a side-by-side ("horizontal") or stacked ("vertical") split
# in the launcher only. The dashboard's inspector is always side-by-side: a
# stacked one would put the session list's rows and the output's rows in
# competition on the axis both are scarcest on.
#
# On the dashboard, ratio is a preference rather than an allocation — it is
# clamped up to the inspector's own minimum width and down to whatever leaves
# the list its own, so both floors hold whatever you write here.
[defaults.preview]
direction = "horizontal"
ratio = 0.5
refresh_ms = 500
min_cols = 100
min_rows = 30

# Live session overview (`amx overview`, F2). `compact = true` (the default)
# opens every tile as the compact summary; `false` opens the full live preview
# grid. Pressing `c` inside the overview still switches modes, and the daemon
# remembers that choice for later overviews until it restarts.
[defaults.overview]
compact = true

# Watchdog: per-state thresholds (in seconds) after which a session showing
# the corresponding active icon but receiving no new events is flagged as
# stale. The daemon clears the icon and (optionally) fires a one-shot
# notification. Each sub-field independently falls back to the value shown
# when set to 0.
#
# Replaces the older `stale_active_threshold = N` key, which still loads but
# mirrors into `watchdog.active` for backward compatibility.
[defaults.watchdog]
# Active sessions (PostToolUse-driven bolt icon). Bursty tool loops still
# settle within ~10 minutes; raise this if a long-running tool legitimately
# stays active longer.
active = 600
# Subagent sessions (SubagentStart-driven icon). Long agentic workflows can
# legitimately span half an hour; the higher threshold avoids false stales.
subagent = 1800
# Compact passes (PreCompact-driven icon). Compaction should always finish
# within a few minutes; a sub-3-minute threshold catches stuck compactions
# quickly.
compact = 180
# Account-level hook-silence: how long an entire profile can produce zero
# hook events before the watchdog reports the account is likely
# misconfigured. Defaults to 4 hours (14400 seconds).
hook_silence = 14400
# Periodic screen probe that detects Claude context-limit stalls (the
# "Context limit reached · /compact or /clear to continue" banner). When a
# stall is detected, the bolt ⚡ icon is swapped to the error ❗ icon and a
# one-shot notification fires (gated by [defaults.notifications].stop_failure).
# Set to false to disable the probe entirely. Default: true.
# claude_context_limit_probe = true

# Stop confirmation: a harness that finishes a turn and then keeps working on
# its own would otherwise flip the tab between the active ⚡ and terminal 🛑
# icons (and fire a notification) on every false ending. A native stop is held
# while the tab keeps showing ⚡ and paints 🛑 only once *both* halves agree: the
# session has been quiet for `delay` seconds *and* the harness's own idle probe
# confirms the pane is really idle. `timeout` is the hard deadline after which
# the stop commits unconfirmed, so a window nothing ever confirms still
# converges. A verified harness-process exit bypasses the gate, as does a new
# prompt or any other sign the harness is still working (the held stop is
# dropped instead of painting). These values are read once when the daemon
# starts: run `amx daemon restart` after changing them.
[defaults.stop_confirm]
# Quiet seconds required before a held stop may paint 🛑. Set to 0 to use the
# default.
delay = 6
# Hard deadline in seconds: past this the held stop commits even without
# confirmation, so a window whose harness produces no idle evidence still
# converges. Must be >= delay. Set to 0 to use the default.
timeout = 15
# Set to false to restore the previous behaviour, where 🛑 paints the instant
# the stop hook lands. Default: true.
# enabled = true

# Screen classifier patterns are NOT configured here. The harness UI copy the
# idle probe matches on (status lines, interrupt hints, composer placeholders,
# the context-limit banner) ships embedded in the binary and is overridden per
# pattern set by dropping a file in a sibling directory of this one:
#
#   ~/.config/agent-mux/screenstate/claude.toml
#   ~/.config/agent-mux/screenstate/codex.toml
#   ~/.config/agent-mux/screenstate/contextlimit.toml
#
# An override REPLACES the embedded set rather than merging into it, so start
# from the shipped copy (internal/screenstate/patterns_<name>.toml and
# internal/contextlimit/patterns_contextlimit.toml in the source tree) and edit
# the whole file. A file that cannot be read or validated is skipped, the
# embedded default is kept, and `amx doctor` reports it as
# `screenstate_override_invalid`. Patterns are loaded once at daemon startup, so
# run `amx daemon restart` after editing. `amx doctor` prints the active source
# for every pattern set; see docs/watchdog.md for the file format and for
# `screenstate_persistent_decline`, the strict-doctor failure raised when the
# classifier stops matching a harness's UI entirely.

# Session archive: retention policy for the searchable filesystem transcript
# cache. Refresh/prune operations hide entries older than keep_days; harness
# transcript files on disk are left intact. Set keep_days to 0 to use the
# default.
# scan_max_age_days bounds the per-refresh transcript walk: files whose
# mtime is older than the cutoff are skipped without opening, while
# existing index entries remain searchable until keep_days retires them.
# Set to 0 to inherit keep_days, or to -1 for "scan everything".
# [defaults.session_archive]
# keep_days = 30
# scan_max_age_days = 30

# Cross-harness handoff packs are private local artifacts. max_bytes bounds the
# complete Markdown file; recent_messages selects the newest visible messages
# considered before deterministic budget trimming.
[defaults.handoff]
max_bytes = 65536
recent_messages = 12

# Private diagnostic state is stored below $XDG_STATE_HOME/agent-mux (or
# ~/.local/state/agent-mux). Journal entries contain causal metadata and HMACs,
# never raw hook payloads. Native harness logs are raw and may contain prompts,
# tool arguments, paths, or model output. Agent Mux keeps their directories
# private (0700), launches managed writers under umask 077, never includes them
# unredacted in a diagnostic bundle, and defers quota pruning for active writers.
# Explicit harness logging flags or RUST_LOG settings take precedence; `amx
# doctor` labels their coverage external or degraded instead of replacing them.
[defaults.diagnostics]
journal_enabled = true
journal_keep_days = 14
journal_max_mib = 256
# journal_detail controls hook-client journal volume. "standard" (the default)
# suppresses healthy intermediate hook stages so each hook event costs a few
# records: hook.delivery and every error/rejection/degraded outcome are always
# written. "full" restores every per-stage success record for deep debugging.
journal_detail = "standard"
native_logging = true
native_keep_days = 14
native_max_mib = 1024
native_session_max_mib = 128

# [defaults.jump] is DEPRECATED and selects nothing.
#
# It named the session states that the bracket chords ]/[ and }/{ treated as
# "attention". Those chords are unbound: the dashboard walks the Needs You group
# with n/N, in the order the list already shows it, so what counts as attention
# is the grouping you can see rather than a second set that could disagree with
# it. Delete the table on your next edit.
#
# An existing table is still accepted and still validated — a file that was
# valid before the upgrade loads unchanged, and an unknown state name is still
# an error — and Agent Mux never rewrites it for you. It is reported once, as a
# dismissible Configuration warning in the dashboard's health reading.
# [defaults.jump]
# attention_states = ["key", "error", "warning", "question"]

[defaults.notifications]

# Native notifications require alerter 26 or newer. AgentMux searches PATH and
# common Homebrew/MacPorts locations by default. Set an absolute path only to
# make that executable authoritative.
# alerter_path = "/custom/path/to/alerter"

# Notify when a session is waiting for your permission to use a tool.
permission = true

# Notify when a session asks you a question (Claude's elicitation prompts).
# Omitted, it follows `permission`.
# elicitation = true

# Notify when a session stops or exits.
stop = true

# Notify when a session stops because of a failure.
stop_failure = true

# Notify (one-shot) when a session is detected as stale-active and its icon is
# auto-cleared. See defaults.watchdog.active for the trigger.
stale_active = true

# Notify (one-shot) when a profile has produced zero hook events for the
# duration set in defaults.watchdog.hook_silence — useful for catching a
# misconfigured settings.json or a daemon-down window where every session
# silently looks idle.
hook_silence = true

# Delay permission notifications by this many milliseconds. The window
# coalesces rapid duplicate hooks; the notification is only cancelled when the
# session reaches a terminal/idle state before the window expires.
# Set to 1 to disable the debounce and notify immediately.
permission_debounce_ms = 500

# Minimum seconds between two notifications of the same kind for the same tab.
# Raise it if a busy session that stops repeatedly is too chatty. Set to 0 to
# use the default (10). Read once at daemon start: run `amx daemon restart`
# after changing it.
# cooldown_seconds = 10

# Quiet hours in local 24-hour time; the window may wrap past midnight. Every
# notification inside it is suppressed (the tab icons still change). Leave
# unset for no quiet hours. Read once at daemon start.
# quiet_hours = "22:00-08:00"


# ── Harness emojis ────────────────────────────────────────────────────────────
# One-character marker per harness, prepended to the Kitty tab title just
# before the project name so you can tell at a glance which harness is
# running in each tab. Every harness referenced by a profile below must
# have an entry here. Values must be a single emoji glyph that does not
# collide with the palette state icons (⚡ 🛑 🔑 ⚠️ ❗ 🤖 🌀 ❓).
[harness_emojis]
claude  = "🦊"
copilot = "🚁"
codex   = "📟"


# ── Harness colors ────────────────────────────────────────────────────────────
# Foreground color per harness for harness-name cells in the dashboard list and
# launch picker. Every harness referenced by a profile below should have an
# entry here. Valid colors: green, blue, red, orange, purple, teal, pink,
# yellow, gray, cyan.
[harness_colors]
claude  = "blue"
copilot = "green"
codex   = "purple"


# ── Profiles ──────────────────────────────────────────────────────────────────
# A profile name is a unique launch identity. It ties a harness to an isolated
# home directory and is the value projects and one-time overrides reference.
# You can define as many profiles as you like and mix harnesses freely.
# If the same account or project family spans harnesses, give each variant a
# distinct name, for example "vta" and "vta-codex".
# Tab bar color comes from each profile's `color` (below). The harness
# shows as a one-character emoji prefix in the Kitty tab title, and harness
# labels use [harness_colors] above.
#
# Required fields:
#   name      Unique identifier used to reference this profile from projects.
#   harness   Which agent CLI to launch. Supported: "claude", "copilot", "codex".
#   home_dir  Isolated config/auth directory for this profile.
#             Claude exports CLAUDE_CONFIG_DIR=<home_dir>.
#             Copilot exports COPILOT_HOME=<home_dir>.
#             Codex exports CODEX_HOME=<home_dir>.
#   color     Per-profile palette color used to render the project title in
#             the dashboard list, picker, detail header, account chips, and
#             inactive Kitty tab-bar accent. Active tab colors come from
#             kitty.conf. Valid colors: green, blue, red, orange, purple,
#             teal, pink, yellow, gray, cyan.
#
# Optional fields:
#   args      Flags passed to every session launched under this profile.
#             These override defaults.args; project args override these.
#   watchdog  Per-profile override of defaults.watchdog. Any sub-field set
#             to 0 (or omitted) falls back to the corresponding default.
#             Example:
#               watchdog = { active = 300, subagent = 2400 }

# Example Claude profile:
# [[profiles]]
# name = "claude-work"
# harness = "claude"
# home_dir = "~/.config/claude-work"
# color = "yellow"
# args = ["--dangerously-skip-permissions"]

# Example Copilot profile:
# [[profiles]]
# name = "copilot-work"
# harness = "copilot"
# home_dir = "~/.copilot-work"
# color = "green"
# args = ["--model", "gpt-5"]

# Example Codex profile:
# [[profiles]]
# name = "codex-work"
# harness = "codex"
# home_dir = "~/.codex-work"
# color = "purple"
# args = ["--dangerously-bypass-hook-trust"]


# ── Projects ──────────────────────────────────────────────────────────────────
# A project is a launchable session template: a title, a working directory,
# and the profile to use by default.
#
# Required fields:
#   title      Display name shown in the dashboard and used as the tab title.
#   directory  Working directory the session opens in. Supports `~`.
#   profile    Name of the profile to launch this project with by default.
#              Can be overridden at launch time from the TUI without changing
#              this file.
#
# Optional fields:
#   args       Flags passed to this session only. Override profile args.
#              Omit or leave empty to inherit the profile's args.
#   env        Key/value pairs injected into the session's environment.
#   groups     Arbitrary labels for filtering in the dashboard and launcher.
#   asl_overseer
#              Opt this project in to overseer supervision of its
#              agent-session-loop runs. Only `true` opts in; `false` and an
#              omitted key both mean excluded, and nothing turns this on for
#              you — installing or upgrading amx never writes it, and the
#              overseer never enrolls a project itself.

# Example project:
# [[projects]]
# title = "dotfiles"
# directory = "~"
# profile = "claude-work"
# groups = ["config"]

# Example project opted in to overseer supervision:
# [[projects]]
# title = "api"
# directory = "~/projects/api"
# profile = "claude-work"
# asl_overseer = true

# Example project explicitly kept out. Identical in effect to omitting the key;
# write it when you want the answer recorded rather than left open.
# [[projects]]
# title = "client-work"
# directory = "~/projects/client-work"
# profile = "claude-work"
# asl_overseer = false


# ── Hook overrides ────────────────────────────────────────────────────────────
# By default, amx installs hook commands for all events into every profile's
# hook file. Use this section to suppress specific events per profile.
#
# disabled_events accepts any of the hook event names that amx installs for the
# selected harness.
#   Claude examples: SessionStart, UserPromptSubmit, PreToolUse, SubagentStart,
#     SubagentStop, PostToolUse, PostToolUseFailure, PermissionRequest, Stop,
#     TaskCompleted, SessionEnd, Notification.
#   Copilot examples: sessionStart, userPromptSubmitted, preToolUse,
#     postToolUse, permissionRequest, agentStop, notification.
#   Codex examples: SessionStart, UserPromptSubmit, PreToolUse,
#     PermissionRequest, PostToolUse, PreCompact, PostCompact, SubagentStart,
#     SubagentStop, Stop.

# Optional per-profile hook overrides:
# [hooks.overrides.claude-work]
# disabled_events = []


# ── Legacy field names (migration) ────────────────────────────────────────────
# The following field names from earlier versions still load without error but
# are deprecated. New configs should use the current names shown above.
#
#   accounts              → profiles
#   sessions              → projects
#   config_dir            → home_dir   (on profiles)
#   account               → profile    (on projects)
#   claude_flags          → args
#   stale_active_threshold → [defaults.watchdog].active
