[defaults]
sort = "alpha"
refresh_interval = 2
guard_duration = 1
idle_threshold = 300  # seconds of inactivity before a session is grouped as Idle in the dashboard

[defaults.notifications]
error = false
permission = true
stop = true

[defaults.preview]
direction = "horizontal"   # "horizontal" | "vertical"
ratio = 0.5                # fraction of width (horizontal) or height (vertical) given to preview
refresh_ms = 500           # tick interval while preview is open
min_cols = 100             # below this, horizontal split is disabled
min_rows = 30              # below this, vertical split is disabled

[[accounts]]
name = "work"
config_dir = "~/.config/claude-work"
color = "blue"

[[accounts]]
name = "personal"
config_dir = "~/.config/claude"
color = "green"

[[sessions]]
title = "W:api"
directory = "~/projects/api"
account = "work"
claude_flags = []

[[sessions]]
title = "P:dotfiles"
directory = "~"
account = "personal"

[hooks.overrides.personal]
disabled_events = []
