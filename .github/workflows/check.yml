name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install Rye
        uses: eifinger/setup-rye@v4

      - name: Install Python dev dependencies
        run: rye sync

      - name: Run tests
        run: |
          python3 tests/test_toml_roundtrip.py
          python3 tests/test_toml_writer.py
          python3 tests/test_config_validator.py
          python3 tests/test_hooks_validator.py
          python3 tests/test_data_files.py
          python3 tests/test_smoke.py

      - name: Lint Python
        run: rye run ruff check kittens/

      - name: Check Python formatting
        run: rye run ruff format --check kittens/

      - name: Typecheck
        run: rye run mypy kittens/

      - name: Check version consistency
        run: |
          python3 -c "
          import tomllib
          v = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          f = open('VERSION').read().strip()
          assert v == f, f'Version mismatch: pyproject.toml={v} VERSION={f}'
          print(f'Version {v} OK')
          "
