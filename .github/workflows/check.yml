name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install jq shellcheck

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python dev dependencies
        run: uv sync

      - name: Run tests
        run: |
          python3 tests/test_toml_roundtrip.py
          python3 tests/test_toml_writer.py
          python3 tests/test_config_validator.py
          python3 tests/test_hooks_validator.py
          python3 tests/test_hooks_install.py
          python3 tests/test_data_files.py
          python3 tests/test_smoke.py

      - name: Lint (Python + shell)
        run: just lint

      - name: Check Python formatting
        run: uv run ruff format --check kittens/

      - name: Typecheck
        run: uv run mypy kittens/

      - name: Audit keybindings
        run: python3 scripts/check_keybindings.py

      - name: Validate Bash completion syntax
        run: bash -n completions/_amx.bash

      - name: Check version consistency
        run: |
          python3 -c "
          import tomllib
          v = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          f = open('VERSION').read().strip()
          assert v == f, f'Version mismatch: pyproject.toml={v} VERSION={f}'
          print(f'Version {v} OK')
          "
