# Default Claude Code screen patterns.
#
# Only UI COPY lives here. Evaluation order, positional requirements and the
# veto-first contract stay in Go (see claude.go) — a pattern file must never be
# able to imply when a clause is consulted. In particular, the order of the
# three status-line regexes below says nothing: claudeLatestStatusLine tests
# working first, on purpose, and that ordering is Go's.
#
# Clause names live in one namespace shared by [regex], [phrases] and [group],
# so a [group] ref may name any of the three.
#
# Phrases match a lowercase fold of the screen and must therefore be written
# lowercase; regexes match the capture as read.

harness = "claude"

[regex]

# composer_line matches Claude's framed empty composer: the ❯ prompt
# indicator followed by only horizontal whitespace, tolerating the input box's
# leading and trailing vertical edges (│/┃). Claude 2.1.195 emits a non-breaking
# space after ❯; Kitty preserves it in get-text output, so it is included
# explicitly. A composer holding queued input has text after ❯ and cannot match,
# so a user still typing is never read as idle.
composer_line = '(?m)^[\t \x{00a0}]*(?:[│┃][\t \x{00a0}]*)?\x{276f}[\t \x{00a0}]*(?:[│┃][\t \x{00a0}]*)?$'

# choice_line matches a selected menu option in a Claude prompt
# ("❯ 1. Yes, proceed"). It requires the ❯ selection indicator so a plain
# transcript numbered list ("1. First point") cannot be mistaken for an open
# choice prompt.
choice_line = '(?m)^\s*(?:[│┃]\s*)?\x{276f}\s*\d+\.\s'

# interrupted_status_line matches Claude's generated interruption marker
# ("⎿ Interrupted by user", "[Request interrupted by user]", "Interrupted ·
# …"). Like the Codex analog it anchors the keyword to the start of the status
# line (after any bracket/box/glyph decoration) so transcript prose that merely
# narrates an interruption cannot match.
interrupted_status_line = '(?i)^[^\p{L}\p{N}]*(?:request\s+)?interrupted\b'

# working_status_line is the live-turn discriminator.
#
# The leading glyph is deliberately NOT matched: live captures show it cycling
# ✽ U+273D, ● U+25CF, ✳ U+2733 and a bare · U+00B7 within a SINGLE turn, and ·
# is also Claude's separator and footer glyph. [^\p{L}\p{N}]* skips whatever
# decoration is present and cannot skip past a letter or digit, so the match
# still anchors on the line's first word. The gerund is not matched (Claude
# randomizes it) and "esc to interrupt" is not required (2.1.x dropped it —
# that removal is this whole bug). The ellipsis plus the parenthesized LIVE
# elapsed timer, on the same line, is the discriminator.
#
# Claude 2.1.296 also draws the spinner line with NO timer for its first
# second or so ("✳ Moseying…" — tmux capture claude_working_no_timer), and
# without a second form that live screen read as a quiescent finished turn.
# The second alternative accepts a glyph-led single word ending in the
# ellipsis and nothing after it. It needs the leading glyph so an indented
# "Reading 1 file…" tool line does not count; the accepted cost is that a
# transcript line consisting of one glyph-led word and an ellipsis ("⏺ Hmm…")
# also vetoes while it is the latest status line, which withholds a stop
# rather than granting one.
working_status_line = '^(?:[^\p{L}\p{N}]*\p{L}[\p{L}\p{M}]*\x{2026}\s*\(\s*\d+[hms]\b|\s*[^\s\p{L}\p{N}]\s+\p{L}[\p{L}\p{M}]*\x{2026}\s*$)'

# completed_status_line is the past-tense analog of codex's worked-for line.
# Claude randomizes the verb, so only the SHAPE is pinned: one leading word,
# " for ", a duration, END OF LINE. The end anchor is what makes this safe as
# positive evidence — without it, "Waited for 3s (see above)" matches, and so
# does the "thought for 5s" segment inside a working line's parentheses.
#
# Claude 2.1.296 appends the wall-clock finish time ("✻ Crunched for 5s · done
# 5:14 PM", tmux capture claude_idle_completed_t0), which this pattern does
# NOT accept, on purpose: such a pane reads as quiescent, the weakest tier.
# Accepting the suffix would promote tmux captures claude_working_streaming_t0
# and _t1 — a live turn streaming text with no spinner line, under the previous
# turn's finished line — from quiescent to terminal_shape, and so spend fewer
# stabilization samples on a screen that is not finished.
completed_status_line = '^[^\p{L}\p{N}]*\p{L}[\p{L}\p{M}]*\s+for\s+(?:\d+[hms]\s*)+$'

[phrases]

# Legacy backstop only. Claude Code 2.1.x no longer renders "esc to interrupt"
# during a tool-free turn, so this can no longer be the primary working signal —
# but it is still emitted by older builds and a one-way veto costs nothing.
interrupt_hint = ["esc to interrupt"]

# The ctrl+b form is rendered by a live Bash tool run.
background_task = ["ctrl+b to"]

# Claude permission, elicitation, and other user-blocking choice prompts. The
# hook path normally paints these as key/question; the screen read is a second
# line of defence so a stuck bolt with a visible prompt is never settled to
# stop. These are English-only and exhaustive by construction, which is exactly
# the limitation a user override exists to lift.
#
# The four lists below used to be one flat blocking_prompt list. They are split
# so a fired veto can also say WHICH prompt fired it — see claude_prompt.go,
# which reads them and maps each to a ClaudePromptKind. The split is copy only:
# the SET of kinds is Go constants and a new list here reaches no icon and no
# gloss, so widening one of these four is a repair and inventing a fifth is not.
#
# Every list is OPTIONAL to an override, unlike Codex's kind clauses. Losing one
# costs a reason string, never a refusal, because blocking_prompt below stays
# required and still vetoes. See the note above claudeRequirements in claude.go.

# "Do you want to proceed?" (a Bash command), "Do you want to allow …" (a tool
# or an MCP server). The 🔑 half.
prompt_permission = [
    "do you want to proceed",
    "do you want to allow",
]

# "Do you trust the files in this folder?", Claude's startup workspace-trust
# dialog. It is its own kind rather than a permission because nothing in the
# session is waiting on it — the session has not started.
# Claude 2.1.296 rewords the dialog as "Is this a project you created or one you
# trust?" with a "Yes, I trust this folder" option (tmux capture
# claude_trust_prompt), which no longer contains "do you trust".
prompt_trust = [
    "do you trust",
    "yes, i trust this folder",
]

# "Do you want to make this edit to app.go?", "Do you want to create foo.txt?" —
# a write to the filesystem, which is the prompt a user most often wants named,
# since it is the one whose answer is not obvious from the icon.
prompt_edit = [
    "do you want to make this edit",
    "do you want to create",
]

# "Would you like to …", Claude asking the user to choose rather than to
# approve. Deliberately the loosest wording of the four, which is why
# classifyClaudePrompt tests it LAST.
prompt_elicitation = ["would you like to"]

[group]

# blocking_prompt is the clause claude.go's veto reads, and it is a group only
# so the four kind lists above are the single home of the copy. An `any` list
# with no `all` is a plain OR, so this matches exactly what the flat list it
# replaced matched.
#
# An override is free to define blocking_prompt as a flat phrase list again:
# claudeRequirements asks for it as AnyClause, and Patterns.Match resolves a
# regex, a phrase list and a group alike. Such a set still vetoes correctly and
# simply yields no kind.
[group.blocking_prompt]
any = [
    "prompt_permission",
    "prompt_trust",
    "prompt_edit",
    "prompt_elicitation",
]
