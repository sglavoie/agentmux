# Default Codex screen patterns.
#
# Only UI COPY lives here. Evaluation order, positional requirements and the
# veto-first contract stay in Go (see codex.go and codex_prompt.go) — a pattern
# file must never be able to imply when a clause is consulted. In particular:
# the horizontal-rule framing that makes `completed_marker_line` trustworthy,
# the requirement that the composer appear AFTER the terminal marker, and the
# latest-status-line-wins scan are all Go's, and none of them can be expressed
# here.
#
# Clause names live in one namespace shared by [regex], [phrases] and [group],
# so a [group] ref may name any of the three.
#
# Phrases match a lowercase fold and must therefore be written lowercase;
# regexes match the capture as read.

harness = "codex"

[regex]

# composer_line matches a Codex composer line and CAPTURES whatever follows the
# chevron; codexClauses.composerLine then requires that remainder to be empty or
# to equal one entry of composer_placeholder exactly. The split exists so the
# placeholders can be a first-class list a user extends without rewriting a
# regex; the "equal exactly" half is the end anchor this pattern used to carry
# inline, and it is Go's.
#
# Codex renders the empty composer with a dim placeholder. Kitty's get-text
# output intentionally drops styling, so the placeholder is indistinguishable
# from ordinary text and must be recognized explicitly. A composer holding
# queued input has text after the chevron that is not a known placeholder and
# cannot match, so a user still typing is never read as idle.
composer_line = '^\s*(?:\x{203a}|>)\s*(.*)$'

# context_zero_line matches Codex's footer reporting an empty context window
# ("Context 0% used"), the positive half of the cleared-screen evidence.
context_zero_line = '(?i)\bcontext\b.*(?:^|[^0-9])0\s*%'

# labeled_transcript_line matches an explicitly labelled transcript turn
# ("user:", "codex:"). It is one of the negative tests that keeps a stopped
# session's scrollback from reading as freshly cleared.
labeled_transcript_line = '(?i)^\s*(?:user|codex|assistant|system)\s*:'

# banner_line matches the first line of the header Codex draws at the top of a
# fresh or cleared session (">_ OpenAI Codex (v0.162.1)"). Builds up to 0.149.x
# drew that header inside a box, which the cleared-screen check already reads
# as chrome; codex-cli 0.162.x draws it bare, and a bare line starting with ">"
# is otherwise a transcript line there. It is the one exemption from that
# negative test, so keep it anchored on the whole product name: see
# testdata/tmux/codex_cleared.txt.
banner_line = '^\s*>_ OpenAI Codex(?:\s|$)'

# worked_for_line matches Codex's completed-turn status line ("Worked for
# 1m 30s"). The trailing digit requirement anchors on a real duration so
# transcript prose such as "worked for the previous release" cannot match.
#
# It matches nothing on a codex-cli 0.149.x screen: that build dropped the
# line entirely in favour of the framed marker below. It is retained for older
# Codex builds, which a user may still be running.
worked_for_line = '(?i)^[^\p{L}\p{N}]*worked for\s+\d'

# completed_marker_line matches codex-cli 0.149.x's end-of-turn marker line.
# That build prints no duration at all: the whole line is a bullet glyph and the
# single word "Completed", optionally with a period.
#
# A one-word marker is far weaker evidence than "Worked for 1m 30s" — an
# assistant message reading "Completed." would satisfy it on its own — so it is
# NEVER honoured by itself. codexClauses.completedMarkerAt additionally requires
# the horizontal rules Codex draws above and below it, and that framing, which
# stays in Go, is what separates the harness-authored marker from transcript
# prose.
completed_marker_line = '(?i)^[^\p{L}\p{N}]*completed\.?\s*$'

# working_status_line matches Codex's in-progress status line ("Working
# (5s • Esc to interrupt)"). A later match than the worked-for line means the
# turn is still active, so the completed-turn classifier bails.
working_status_line = '(?i)^[^\p{L}\p{N}]*working\b'

# interrupt_hint is the generic in-flight interrupt hint, whatever key it names.
# Codex's request_user_input footer also contains it, but that screen is
# rejected by the prompt classifier before this veto is consulted, so the
# overlap is free.
interrupt_hint = '(?i)\bto (?:interrupt|cancel)\b'

# live_elapsed_status_line is the word-independent twin of working_status_line:
# a renamed spinner still ticks a timer, and a ticking timer is by definition
# not a finished turn. "Worked for 1m 30s" has no parentheses and cannot match.
#
# Do NOT copy this into patterns_claude.toml: it also matches a parenthesised
# elapsed time on a Claude working line, which is harmless only because this
# file is Codex-only.
live_elapsed_status_line = '^[^\p{L}\p{N}]*\p{L}[\p{L}\p{M}]*\s*\(\s*\d+[hms]\b'

# background_terminal_footer matches Codex's running-background-work footer
# ("1 background terminal running · /ps to view · /stop to close"). Codex
# renders it both appended to a live "Working (…)" status line and on its own
# line under a finished or interrupted turn — the second shape is the one that
# matters, because there the model's turn really is over while a detached
# process it started is not.
#
# THE COUNT IS THE ANCHOR, and it must be non-zero. Codex's own transcript prose
# says things like "• Stopping all background terminals." (a real line in
# testdata/codex_idle_completed_t0.txt); requiring "<n> background <noun>
# running" is what keeps narration from pinning a pane at ⚡ forever.
#
# The noun is matched loosely on purpose. This is a ONE-WAY veto, so a rename
# from "terminal" to "task" costing a false 🛑 over live background work is the
# expensive failure; matching a synonym Codex does not use today costs nothing.
# "task" is not speculative — it is what Claude's own background manager calls
# these (see patterns_claude.toml's background_task).
background_terminal_footer = '(?i)\b[1-9]\d*\s+background\s+(?:terminal|task)s?\s+running\b'

# interrupted_line matches Codex's TUI-generated interrupted-turn marker
# ("⏹ Interrupted", "• Interrupted by user", "⚠ Conversation interrupted …").
# Like worked_for_line it anchors the keyword to the start of the status line
# (after any bullet/warning-glyph decoration) so transcript prose that merely
# narrates an interruption — or Codex's own "Working (… Esc to interrupt)"
# spinner, which begins with "Working" and never with "interrupted" — cannot
# match.
interrupted_line = '(?i)^[^\p{L}\p{N}]*(?:conversation\s+)?interrupted\b'

# prompt_choice_line matches a selected numbered choice in a Codex prompt
# ("› 1. Yes, apply these edits"). It is the fallback half of the visible-choice
# gate: a prompt whose footer wording changed is still recognizable by the
# chevron-plus-number list it renders.
#
# It is the only prompt clause that is a regex rather than a phrase list,
# because it keys on the SHAPE of a choice line and on no English at all —
# which is exactly why it survives a footer rewording. The (?m) flag is
# load-bearing: the anchors must apply per line of the whole screen.
prompt_choice_line = '(?m)^\s*(?:\x{203a}|>)\s*\d+\.'

[phrases]

# The dim placeholders codex-cli renders in an EMPTY composer. Unlike every
# other phrase list in this directory these are compared for EQUALITY against
# the text after the chevron, not searched for as substrings — see
# codexClauses.composerLine. Keep the list narrow: accepting arbitrary text
# after the chevron would let an old transcript prompt satisfy the
# terminal-screen classifiers, which is exactly what the end anchor prevents
# ("› Run the shell command: sleep 8" is a real line in
# testdata/codex_idle_completed_t0.txt).
#
# ACCEPTED RESIDUAL BRITTLENESS. A Codex build that ships an unknown placeholder
# makes the composer unmatchable and withholds settling — a stuck ⚡, never a
# false 🛑 — which is the direction this package fails in by design. This list
# is the one place a user can repair that without a build.
# TestCodexCurrentScreenContract pins the currently installed placeholder, and
# TestCodexComposerPlaceholderIsNarrow pins the narrowness that costs.
composer_placeholder = [
    "use /skills to list available skills",
    "find and fix a bug in @filename",
    "ask codex to do anything",
]

# ---------------------------------------------------------------------------
# Prompt classification (codex_prompt.go).
#
# These clauses name the user-blocking prompts Codex's TUI renders. WHICH kind
# wins when several match is Go's — the switch in ClassifyCodexPrompt tests
# edit-approval before request-input before unanswered-confirmation before
# command-approval before permission-grant, and several of the lists below
# deliberately overlap, so nothing here may be read as an order. Rearranging
# this file cannot change which kind a screen classifies as.
#
# The visible-choice gate is Go's too: ClassifyCodexPrompt refuses to name a
# kind at all unless prompt_choice_footer or prompt_choice_line matched first,
# so old transcript text quoting prompt wording cannot manufacture a waiting
# state. That gate is control flow, not copy.
# ---------------------------------------------------------------------------

# prompt_choice_footer is the footer hint Codex prints under an ANSWERABLE
# prompt. Together with prompt_choice_line it is the evidence that the prompt is
# live rather than quoted: a transcript can repeat a question, but the footer
# and the selected choice line are drawn by the TUI for the prompt it is waiting
# on right now.
#
# "enter to submit answer" is a superstring of "to submit answer" and therefore
# redundant for matching. It is kept as its own entry because it is the exact
# string codex-cli prints, and a user narrowing this list by deleting the loose
# variant should not silently lose the precise one too.
prompt_choice_footer = [
    "press enter to confirm",
    "enter to submit answer",
    "to submit answer",
    "to submit all",
    "to navigate questions",
    "change question",
    "submit with unanswered questions",
]

# prompt_edit_approval is Codex's "apply these edits?" prompt. Both the plural
# and singular spellings are listed for the same reason as above: the singular
# is a prefix of the plural and so matches both, but writing only the singular
# would read as a typo the next time someone edits this list.
prompt_edit_approval = [
    "would you like to make the following edits",
    "would you like to make the following edit",
]

# prompt_unanswered_confirmation is Codex's confirm-before-continuing prompt.
prompt_unanswered_confirmation = ["unanswered confirmation"]

# prompt_command_approval is Codex's run-this-command prompt, across the
# wordings different codex-cli builds have used for it.
prompt_command_approval = [
    "would you like to run the following command",
    "approve command",
    "command approval",
]

# --- permission_grant: the `allow AND permission` conjunction ---
#
# The three lists below exist only to be combined by group.prompt_permission_*.
# The conjunction is why: "allow" on its own is far too common a word to read as
# a permission prompt — a transcript quoting "allow the build to finish" would
# match — so it counts only when the screen also says "permission". Splitting
# the two halves into named lists is what lets that AND live in [group] instead
# of in Go, which is the point of the group schema.

# The unambiguous namings of the prompt. Either alone is enough.
prompt_permission_named = ["permission grant", "grant permission"]
# The weak halves of the conjunction. NEITHER is sufficient alone; see
# group.prompt_permission_allow_conjunction.
prompt_permission_allow = ["allow"]
prompt_permission_keyword = ["permission"]

# --- request_user_input: the (nav || submit) && pane-action shape ---
#
# codex-cli 0.134.0 moved its question UI into a bottom pane that no single
# substring identifies: the pane's own wording ("Add notes", "Proceed") appears
# in ordinary prose, and its navigation hints appear under other prompts too.
# Requiring one of each — a way to move between questions or submit an answer,
# AND an action the request pane itself offers — is what separates the live pane
# from a transcript that happens to use those words. See
# group.prompt_request_pane_footer.

# The unambiguous namings. Either alone is enough, without any pane action:
# "request_user_input" is the tool name Codex prints, and the unanswered-
# questions warning is only ever drawn by the pane.
prompt_request_user_input_named = [
    "request_user_input",
    "submit with unanswered questions",
]
# One of these two buckets must appear...
prompt_question_navigation = ["to navigate questions", "change question"]
prompt_answer_submission = ["to submit answer", "to submit all"]
# ...alongside one of these, for the pane to be considered visible.
prompt_request_pane_action = [
    "add notes",
    "type your answer",
    "select an option to add notes",
    "none of the above",
    "proceed",
]

[group]

# prompt_permission_allow_conjunction is codex_prompt.go's `allow AND
# permission` test, as data. An `all` list with no `any` is a plain AND.
[group.prompt_permission_allow_conjunction]
all = ["prompt_permission_allow", "prompt_permission_keyword"]

# prompt_permission_grant is the clause ClassifyCodexPrompt reads: either
# naming, or the conjunction. An `any` list with no `all` is a plain OR.
[group.prompt_permission_grant]
any = ["prompt_permission_named", "prompt_permission_allow_conjunction"]

# prompt_request_pane_footer is the three-bucket shape:
# (navigation || submission) && pane action. The single-entry `all` is the
# conjunct that must always hold; the `any` is the disjunction it is ANDed with.
[group.prompt_request_pane_footer]
all = ["prompt_request_pane_action"]
any = ["prompt_question_navigation", "prompt_answer_submission"]

# prompt_request_user_input is the clause ClassifyCodexPrompt reads: either
# naming short-circuits, otherwise the pane footer must be visible.
[group.prompt_request_user_input]
any = ["prompt_request_user_input_named", "prompt_request_pane_footer"]
