# agent-mux.conf — Kitty config snippet for Agent Mux session management
# Include this from your kitty.conf:
#   include agent-mux.conf


#
# Suppress Kitty bell markers/audio globally for Kitty instances that include
# this snippet. Agent Mux uses tab icons for attention states, including
# question prompts, so the bell marker/noise would be redundant.
#

enable_tab_bar_bell_markers no
enable_audio_bell no


#
# Direct tab switching: cmd+1 through cmd+0 for tabs 1–10
#

map cmd+1  goto_tab 1
map cmd+2  goto_tab 2
map cmd+3  goto_tab 3
map cmd+4  goto_tab 4
map cmd+5  goto_tab 5
map cmd+6  goto_tab 6
map cmd+7  goto_tab 7
map cmd+8  goto_tab 8
map cmd+9  goto_tab 9
map cmd+0  goto_tab 10

#
# Toggle between the two most recently used tabs
#

map cmd+l  goto_tab -1


#
# Tab title template: show tab index followed by stack indicator and title
# Overrides the default from kitty.conf to prepend the index number.
#

tab_title_template "{index}{'≣' if layout_name == 'stack' else ':'}{title}"


#
# Keybinding reference overlay
#

map f1  launch --type=overlay --allow-remote-control amx keybindings


#
# Live session overview (overlay grid)
# One tile per managed session with a compact header and a live preview of the
# pane. The active window is passed so the tile for the session you came from is
# selected first; invoking it again focuses the overview already open.
#

map f2 launch --type=overlay --allow-remote-control amx overview --window-id @active-kitty-window-id


#
# Toggle error/failure/warning markers in scrollback for quick visual scanning
#

map f3  toggle_marker iregex 1 \\bError\\b 2 \\bFailed\\b 3 \\bWarning\\b 3 \\bDEPRECATED\\b


#
# Set tab harness icon (overlay picker)
# This changes only the displayed badge; the tab's harness metadata is unchanged.
#

map f5 launch --type=overlay --allow-remote-control amx icon-picker


#
# Set tab color (overlay color picker)
#

map f6  launch --type=overlay --allow-remote-control amx color-picker

mark1_foreground  white
mark1_background  #cc3333
mark2_foreground  white
mark2_background  #cc7733
mark3_foreground  white
mark3_background  #b8860b


#
# Clear markers and state icons (error, stop, etc.) from the current tab
#

map f8  launch --type=background --allow-remote-control amx hook-indicator user_clear --window-id @active-kitty-window-id


#
# Toggle mute on the focused tab (suppresses macOS notifications)
#

map f10 launch --type=background --allow-remote-control amx mute-toggle --window-id @active-kitty-window-id


#
# Focus next tab requiring attention
#

map f4 launch --type=background --allow-remote-control amx focus-next --window-id @active-kitty-window-id


#
# Focus the previous/next Agent Mux-managed tab
#

map f7 launch --type=background --allow-remote-control amx focus-prev-managed --window-id @active-kitty-window-id
map f9 launch --type=background --allow-remote-control amx focus-next-managed --window-id @active-kitty-window-id


#
# Interactive Agent Mux dashboard (overlay picker)
# Opens a navigable list of all managed tabs; switch, close, or create sessions.
#
map ctrl+shift+d  launch --type=overlay --allow-remote-control amx --window-id @active-kitty-window-id
