# cc-manager account definitions
#
# Each [[accounts]] entry defines a Claude account with:
#   name       — Account identifier (referenced in sessions.toml)
#   config_dir — Path to Claude config directory (empty or ~/.claude = default)
#   color      — Tab color from built-in palette:
#                green, blue, red, orange, purple, teal, pink, yellow, gray, cyan
# --- END OF DOCUMENTATION (do not edit above this line) ---

[[accounts]]
name = "work"
config_dir = "~/.claude"
color = "green"

[[accounts]]
name = "personal"
config_dir = "~/.claude-personal"
color = "blue"

# Add more accounts as needed:
# [[accounts]]
# name = "client-x"
# config_dir = "~/.claude-client-x"
# color = "orange"
