[project]
name = "sglavoie-cc-manager-kitty"
version = "0.2.0"
description = "Claude Code session manager for the Kitty terminal"
authors = [
    { name = "Sébastien Lavoie", email = "sgdlavoie@gmail.com" }
]
dependencies = []
readme = "README.md"
requires-python = ">= 3.13"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.2",
    "mypy>=1.19.1",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["kittens/cc_dashboard"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["kittens"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"claude_dashboard.py" = ["E402"]
"cc_session_picker.py" = ["E402"]
"cc_quick_switch.py" = ["E402"]
"cc_keybindings.py" = ["E402"]
"cc_color_picker.py" = ["E402"]
"cc_tab_status.py" = ["E402"]
"cc_session_info.py" = ["E402"]
"cc_session_notes.py" = ["E402"]
"cc_reorder_tabs.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
mypy_path = "kittens"
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["kittens/cc_dashboard/cc_dashboard"]

[[tool.mypy.overrides]]
module = [
    "toml_writer",
    "toml_reader",
    "kittens.*",
]
ignore_missing_imports = true
follow_untyped_imports = true
