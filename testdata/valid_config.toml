[defaults]
sort = "alpha"
refresh_interval = 2
guard_duration = 1

[defaults.notifications]
error = false
permission = true
stop = true

[harness_emojis]
claude = "🦊"

[harness_colors]
claude = "blue"

[[accounts]]
name = "work"
config_dir = "~/.config/claude-work"
color = "yellow"

[[accounts]]
name = "personal"
config_dir = "~/.config/claude"
color = "cyan"

[[sessions]]
title = "W:api"
directory = "~/projects/api"
account = "work"
claude_flags = ["--dangerously-skip-permissions"]

[[sessions]]
title = "P:dotfiles"
directory = "~"
account = "personal"

[hooks.overrides.personal]
disabled_events = ["Stop"]
