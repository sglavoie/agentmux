# cc-manager.conf — Kitty config snippet for Claude Code session management
# Include this from your kitty.conf:
#   include cc-manager.conf


#
# Direct tab switching: cmd+1 through cmd+0 for tabs 1–10
#

map cmd+1  goto_tab 1
map cmd+2  goto_tab 2
map cmd+3  goto_tab 3
map cmd+4  goto_tab 4
map cmd+5  goto_tab 5
map cmd+6  goto_tab 6
map cmd+7  goto_tab 7
map cmd+8  goto_tab 8
map cmd+9  goto_tab 9
map cmd+0  goto_tab 10

#
# Toggle between the two most recently used tabs
#

map cmd+l  goto_tab -1


#
# Tab title template: show tab index followed by stack indicator and title
# Overrides the default from kitty.conf to prepend the index number.
#

tab_title_template "{index}:{' ≣' if layout_name == 'stack' else ''} {title}"


#
# Broadcast input to all windows in the current tab (via kitty broadcast kitten)
#

map f1  launch --allow-remote-control kitty +kitten broadcast


#
# Toggle error/failure markers in scrollback for quick visual scanning
#

map f3  toggle_marker iregex 1 \bError\b 2 \bFailed\b

mark1_foreground  white
mark1_background  #cc3333
mark2_foreground  white
mark2_background  #cc7733


#
# Interactive Claude Code session dashboard (overlay picker)
# Opens a navigable list of all Claude tabs; switch, close, or create sessions.
# After `make install`, the kitten is symlinked into ~/.config/kitty/.
#

map ctrl+shift+d  kitten claude_dashboard.py
