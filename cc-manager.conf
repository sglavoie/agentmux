# cc-manager.conf — Kitty config snippet for Claude Code session management
# Include this from your kitty.conf:
#   include cc-manager.conf


#
# Direct tab switching: cmd+1 through cmd+0 for tabs 1–10
#

map cmd+1  goto_tab 1
map cmd+2  goto_tab 2
map cmd+3  goto_tab 3
map cmd+4  goto_tab 4
map cmd+5  goto_tab 5
map cmd+6  goto_tab 6
map cmd+7  goto_tab 7
map cmd+8  goto_tab 8
map cmd+9  goto_tab 9
map cmd+0  goto_tab 10

#
# Toggle between the two most recently used tabs
#

map cmd+l  goto_tab -1


#
# Tab title template: show tab index followed by stack indicator and title
# Overrides the default from kitty.conf to prepend the index number.
#

tab_title_template "{index}:{' ≣' if layout_name == 'stack' else ''} {title}"


#
# Keybinding quick-reference overlay (all ccm-managed keys at a glance)
#

map f1  kitten cc_keybindings.py


#
# Broadcast input to all windows in the current tab (via kitty broadcast kitten)
#

map f12  launch --allow-remote-control kitty +kitten broadcast


#
# Toggle ★star icon on the current tab's title (mark as important)
#

map f2  launch --type=background --allow-remote-control cc-toggle-star @active-kitty-window-id


#
# Toggle ❗flag icon on the current tab's title (visual attention marker, no reorder)
#

map f5  launch --type=background --allow-remote-control cc-toggle-flag @active-kitty-window-id


#
# Interactive color picker overlay for the current tab
#

map f6  kitten cc_color_picker.py


#
# Set a status suffix on the current tab's title
#

map f7  kitten cc_tab_status.py


#
# Session info overlay for the current tab
#

map f8  kitten cc_session_info.py


#
# Session notes overlay for attaching free-text notes to the current tab
#

map f9  kitten cc_session_notes.py


#
# Toggle dim (muted colors) on the current tab
#

map f10  launch --type=background --allow-remote-control cc-toggle-dim @active-kitty-window-id


#
# Toggle focus mode: dim all OTHER managed tabs, keep current tab bright
#

map f11  launch --type=background --allow-remote-control cc-toggle-focus @active-kitty-window-id


#
# Toggle error/failure/warning markers in scrollback for quick visual scanning
#

map f3  toggle_marker iregex 1 \\bError\\b 2 \\bFailed\\b 3 \\bWarning\\b 3 \\bDEPRECATED\\b

mark1_foreground  white
mark1_background  #cc3333
mark2_foreground  white
mark2_background  #cc7733
mark3_foreground  white
mark3_background  #b8860b


#
# Clear markers and state icons (error, stop, etc.) from the current tab
#

map f4  launch --type=background --allow-remote-control cc-hook-indicator clear @active-kitty-window-id


#
# Interactive Claude Code session dashboard (overlay picker)
# Opens a navigable list of all Claude tabs; switch, close, or create sessions.
# After `just install`, the kitten is symlinked into ~/.config/kitty/.
#

map ctrl+shift+d  kitten claude_dashboard.py


#
# Quick-switch: lightweight fuzzy-finder overlay for jumping to a session
# Filters by title, account, or cwd; Enter to switch, Escape to dismiss.
#

map ctrl+shift+p  kitten cc_quick_switch.py
