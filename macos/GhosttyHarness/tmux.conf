# The private tmux server's whole configuration for the feasibility harness.
# run_matrix.py starts the server with `-f` this file and `-S` a socket under
# the run directory, so neither the operator's ~/.tmux.conf nor their default
# server is ever touched.

# Forward modified keys (shift+enter, ctrl+enter, alt+arrows) in the form the
# pane program asked for, rather than collapsing them to legacy bytes.
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm-ghostty:extkeys:RGB:clipboard:focus:sync'
set -s escape-time 10
set -s focus-events on

set -g default-terminal tmux-256color
set -g history-limit 50000
# Wheel events reach the pane program when it asked for the mouse, and enter
# copy mode (tmux's scrollback) otherwise.
set -g mouse on
set -g status off
# The most recently active client's size wins.
set -g window-size latest
set -g remain-on-exit off
set -g set-clipboard on
