# XcodeGen spec for Agent Mux.app. `just mac-app` generates
# macos/AgentMux.xcodeproj from it; the generated project is gitignored, so edit
# this file instead.
name: AgentMux
options:
  bundleIdPrefix: io.github.sglavoie
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  AgentMux:
    type: application
    platform: macOS
    sources:
      - path: AgentMux
      # The palette the Go side paints tab titles with, so the menu bar draws
      # each state with the same glyph.
      - path: ../internal/palette/icons.json
        buildPhase: resources
      - path: ../LICENSE
        buildPhase: resources
      # Ghostty's license notice, for the sources ported under AgentMux/Ghostty
      # and the themes bundled below.
      - path: NOTICE-ghostty
        buildPhase: resources
      # Ghostty's themes, shell integration, and terminfo, found by libghostty
      # beside the terminfo sentinel; vendored by scripts/build-ghosttykit.sh.
      - path: Vendor/resources/ghostty
        type: folder
        buildPhase: resources
      - path: Vendor/resources/terminfo
        type: folder
        buildPhase: resources
    settings:
      base:
        # The product is "Agent Mux.app"; the module keeps a space-free name so
        # tests can `@testable import AgentMux`.
        PRODUCT_NAME: Agent Mux
        PRODUCT_MODULE_NAME: AgentMux
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sglavoie.agentmux
        INFOPLIST_FILE: AgentMux/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # libghostty.a is built by Zig and carries C++ objects but no autolink
        # entries, so its runtime dependencies are spelled here.
        OTHER_LDFLAGS: ["-lc++"]
    dependencies:
      # Static library: linked, never embedded. Its Headers/module.modulemap
      # exposes `import GhosttyKit`, so no bridging header is needed.
      - framework: Vendor/GhosttyKit.xcframework
        embed: false
      - sdk: Carbon.framework
      - sdk: ServiceManagement.framework
      - sdk: UserNotifications.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: CoreText.framework
      - sdk: IOSurface.framework
      - sdk: QuartzCore.framework
      - sdk: UniformTypeIdentifiers.framework
    scheme:
      testTargets:
        - AgentMuxTests
  AgentMuxTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AgentMuxTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sglavoie.agentmux.tests
        # Hosted in the app: the tests run inside Agent Mux.app's process.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Agent Mux.app/Contents/MacOS/Agent Mux"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: AgentMux
      # For `import GhosttyKit` in tests. The hosting app already links the
      # static library, so linking it again would duplicate its symbols.
      - framework: Vendor/GhosttyKit.xcframework
        link: false
        embed: false
