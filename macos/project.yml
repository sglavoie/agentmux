# XcodeGen spec for Agent Mux.app. `just mac-app` generates
# macos/AgentMux.xcodeproj from it; the generated project is gitignored, so edit
# this file instead.
name: AgentMux
options:
  bundleIdPrefix: io.github.sglavoie
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  AgentMux:
    type: application
    platform: macOS
    sources:
      - path: AgentMux
    settings:
      base:
        # The product is "Agent Mux.app"; the module keeps a space-free name so
        # tests can `@testable import AgentMux`.
        PRODUCT_NAME: Agent Mux
        PRODUCT_MODULE_NAME: AgentMux
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sglavoie.agentmux
        INFOPLIST_FILE: AgentMux/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - sdk: Carbon.framework
      - sdk: ServiceManagement.framework
      - sdk: UserNotifications.framework
    scheme:
      testTargets:
        - AgentMuxTests
  AgentMuxTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AgentMuxTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sglavoie.agentmux.tests
        # Hosted in the app: the tests run inside Agent Mux.app's process.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Agent Mux.app/Contents/MacOS/Agent Mux"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: AgentMux
